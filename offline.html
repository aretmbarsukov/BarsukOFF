<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a0c" />
  <title>BarsukON · Sin conexión</title>
  <style>
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:#090a0c; color:#f4f5f7; font:16px/1.6 system-ui,sans-serif; text-align:center; }
    main { max-width:440px; }
    h1 { margin:0 0 12px; font-size:2rem; }
    p { color:#a6adba; }
    button { margin-top:12px; padding:12px 20px; border:0; border-radius:12px; background:#7dd3fc; color:#090a0c; font:inherit; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>BarsukON</h1>
    <p>No hay conexión a internet. Conéctate para consultar reparaciones, reservar citas o acceder a tu cuenta.</p>
    <p>No internet connection. Connect to continue using BarsukON.</p>
    <button type="button" onclick="location.reload()">Reintentar · Try again</button>
  </main>
</body>
</html>
